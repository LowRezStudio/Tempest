[package]
name = "tempest-studio-native"
version = "1.0.0-alpha.1"
edition = "2021"
license = "MIT"
description = "Tempest Studio as a native GPUI app, linking tempest-assets directly"

[[bin]]
name = "tempest-studio"
path = "src/main.rs"

[dependencies]
tempest-assets = { path = "../Tempest.UnrealScript/crates/tempest-assets" }
tempest-upk = { path = "../Tempest.UnrealScript/crates/tempest-upk" }
gpui = { package = "gpui-pre", version = "=0.3.11" }
gpui-component = { version = "=0.9.0", features = ["syntect"] }
gpui-kit-assets = "=0.9.0"
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.11", features = ["font-kit", "x11", "wayland", "runtime_shaders"] }
anyhow = "1"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wgpu = "30"
image = { version = "0.25", default-features = false, features = ["png"] }
gltf = { version = "1", default-features = false, features = ["utils"] }
glam = "0.30"
bytemuck = { version = "1", features = ["derive"] }
pollster = "0.4"
rodio = { version = "0.20", default-features = false, features = ["vorbis"] }
lewton = "0.10"
base64 = "0.22"
ureq = { version = "3", features = ["json"] }
sha2 = "0.10"
semver = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
raw-window-handle = "0.6"
# Movies: Ruffle's sources with the Studio's patches, fetched by scripts/fetch-ruffle.sh.
ruffle_core = { path = "vendor/ruffle/core", features = ["default_font"] }
ruffle_render_wgpu = { path = "vendor/ruffle/render/wgpu" }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Storage_Xps", "Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3

# The asset layer is hot (package parsing, LZO, textures) even in debug builds.
[profile.dev.package."*"]
opt-level = 2
