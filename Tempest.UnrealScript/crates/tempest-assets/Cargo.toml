[package]
name = "tempest-assets"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Typed object layer over Paladins UPK packages: reflection, properties, native asset data"

[lib]
name = "tempest_assets"

[[bin]]
name = "upk"
path = "src/bin/upk.rs"

[dependencies]
tempest-upk = { path = "../tempest-upk" }
tempest-unrealscript = { path = "../tempest-unrealscript" }
md-5 = "0.10"
png = "0.17"
texpresso = "2.0"
# preserve_order: marshal rows travel through JSON (deltas, import/export) and
# must come back with their fields in the original order to rewrite byte-identically.
serde_json = { version = "1", features = ["preserve_order"] }
flate2 = "1"
vorbis_rs = "0.5"
zip = { version = "2", default-features = false, features = ["deflate"] }
# SVG import of shapes (paths, styles and transforms resolved), no text.
usvg = { version = "0.48", default-features = false }
# Glyph outlines for adding characters to a movie font.
ttf-parser = "0.25"
