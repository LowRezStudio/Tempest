# Fallback for scripts/package.sh when no local MinGW-w64 toolchain exists:
#
#   cross build --release --target x86_64-pc-windows-gnu -p tempest-scripting
#
# The default cross image ships MinGW-w64; the static-runtime link flags
# live in .cargo/config.toml so they apply to local builds too.
#
# Apple Silicon (cross 0.2.5): images are amd64-only, so
#   export DOCKER_DEFAULT_PLATFORM=linux/amd64
# and cross wants a host-flavoured toolchain for metadata queries:
#   rustup toolchain add stable-x86_64-unknown-linux-gnu --force-non-host --profile minimal
#   rustup target add x86_64-pc-windows-gnu --toolchain stable-x86_64-unknown-linux-gnu

[target.x86_64-pc-windows-gnu]
# default image: ghcr.io/cross-rs/x86_64-pc-windows-gnu
