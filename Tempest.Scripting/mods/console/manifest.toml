[mod]
id = "tempest-console"
name = "Tempest Console"
version = "1.0.2"
authors = ["Tempest", "Tom"]
readme = "Enables the in-game console (~ opens it, F2 for the single-line prompt). Requires Tempest Scripting."
dependencies = ["tempest-scripting>=1.0.0"]

[scripting]
after = ["tempest-scripting"]
