name: Release Build
run-name: Release ${{ github.ref_name }}

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  # One draft release per tag, created before any platform builds so that
  # electron-builder attaches to it instead of creating its own. The body is
  # the annotated tag's message, passed through the environment (notes may
  # contain quotes).
  release:
    runs-on: ubuntu-22.04
    outputs:
      notes: ${{ steps.notes.outputs.notes }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get release notes from tag
        id: notes
        shell: bash
        run: |
          # The checkout only has the commit; fetch the annotated tag object so
          # %(contents) is the annotation, not the commit message.
          git fetch --force --depth=1 origin "+refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME" 2>/dev/null || true
          notes=$(git tag -l --format='%(contents)' "$GITHUB_REF_NAME" 2>/dev/null || echo "")
          echo "notes<<EOF" >> "$GITHUB_OUTPUT"
          echo "$notes" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Create or update the draft release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NOTES: ${{ steps.notes.outputs.notes }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --draft --notes "$NOTES"
          else
            gh release create "$GITHUB_REF_NAME" --draft --title "Tempest Launcher $GITHUB_REF_NAME" --notes "$NOTES"
          fi

  build:
    needs: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            arch: x64
          - platform: macos-14
            arch: arm64
          - platform: ubuntu-22.04
            arch: x64

    runs-on: ${{ matrix.platform }}

    env:
      # Point electron/electron-builder download caches into the workspace so
      # actions/cache can persist them without relying on per-OS user paths.
      ELECTRON_CACHE: ${{ github.workspace }}/.electron-cache
      ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.electron-builder-cache

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10.0
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Setup Zig 0.16.0
        uses: marler8997/setup-anyzig@master

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: Tempest.Launcher/package.json

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: Tempest.Launcher/pnpm-lock.yaml

      - name: Install Linux packaging deps
        if: startsWith(matrix.platform, 'ubuntu-')
        run: |
          sudo apt update
          sudo apt-get install -y rpm fakeroot

      - name: Compute CLI inputs hash
        id: cli-hash
        shell: bash
        # The AOT publish takes 4-7 minutes. Releases that don't touch these
        # inputs reuse the binaries built by a previous run (see below).
        # Includes the embedded key lists, protocol contract, zig utils and
        # the build script itself.
        run: |
          hash="${{ hashFiles('Tempest.CLI/**', 'MarshalLib/**', 'MarshalLib.Database/**', 'Tempest.Utils/**', 'Tempest.Protocol/**', 'Tempest.Launcher/scripts/build-cli.js', 'keys/*.keys') }}"
          echo "hash=$hash" >> "$GITHUB_OUTPUT"
          echo "$hash" > cli-inputs.sha256

      - name: Restore CLI sidecar from a previous run
        id: cli-artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        # Actions caches are ref-scoped: a tag run cannot restore caches saved
        # by another tag (or by master), so they never hit across releases.
        # Artifacts have no such scoping, so the CLI sidecar rides in an
        # artifact of the previous successful run, tagged with its inputs hash.
        run: |
          want="${{ steps.cli-hash.outputs.hash }}"
          # Walk the newest successful runs of this workflow, newest first.
          for run_id in $(gh api "repos/${{ github.repository }}/actions/workflows/release.yml/runs?status=success&per_page=20" --jq '.workflow_runs[].id'); do
            artifact_id=$(gh api "repos/${{ github.repository }}/actions/runs/$run_id/artifacts" --jq ".artifacts[] | select(.name == \"cli-${{ matrix.platform }}\") | .id" | head -n1)
            [ -z "$artifact_id" ] && continue
            gh api "repos/${{ github.repository }}/actions/artifacts/$artifact_id/zip" > cli-artifact.zip
            # GNU tar (Windows git-bash) and unzip (not installed on Windows)
            # both fail cross-platform; use the platform's native extractor.
            if [[ "$RUNNER_OS" == "Windows" ]]; then
              powershell.exe -NoProfile -Command "Expand-Archive -Path cli-artifact.zip -DestinationPath . -Force"
            else
              unzip -o -q cli-artifact.zip
            fi
            rm cli-artifact.zip
            if [ "$(cat cli-inputs.sha256)" = "$want" ]; then
              echo "hit=true" >> "$GITHUB_OUTPUT"
              echo "Reused CLI binaries from run $run_id (hash $want)"
              exit 0
            fi
            echo "Run $run_id's CLI binaries are stale (built for different inputs); continuing search"
          done
          echo "hit=false" >> "$GITHUB_OUTPUT"

      - name: Install frontend dependencies
        working-directory: Tempest.Launcher
        run: pnpm install --frozen-lockfile

      - name: Build CLI sidecar
        if: steps.cli-artifact.outputs.hit != 'true'
        working-directory: Tempest.Launcher
        run: node scripts/build-cli.js

      # The bundled upk-parser rides in every launcher install; run its zig test
      # suite once per build (Linux is the fastest runner).
      - name: Test upk-parser
        if: steps.cli-artifact.outputs.hit != 'true' && startsWith(matrix.platform, 'ubuntu-')
        working-directory: Tempest.Utils/utils
        run: zig build test

      - name: Upload CLI sidecar artifact
        if: steps.cli-artifact.outputs.hit != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.platform }}
          path: |
            Tempest.Launcher/electron/resources/binaries/**
            cli-inputs.sha256
          retention-days: 30

      - name: Restore Electron / electron-builder downloads
        uses: actions/cache/restore@v4
        with:
          path: |
            .electron-cache
            .electron-builder-cache
          key: electron-tooling-${{ runner.os }}-${{ hashFiles('Tempest.Launcher/pnpm-lock.yaml') }}

      - name: Build frontend
        working-directory: Tempest.Launcher
        run: pnpm build

      - name: Prepare Electron build directory
        working-directory: Tempest.Launcher
        shell: bash
        run: |
          rm -rf electron/build
          cp -r build electron/build

      - name: Compile Electron host
        working-directory: Tempest.Launcher/electron
        run: pnpm compile

      - name: Build Electron app
        working-directory: Tempest.Launcher/electron
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Publish (attach to the draft release) only for real tag builds;
        # workflow_dispatch has no tag, so just build the artifacts.
        run: npx electron-builder --publish ${{ startsWith(github.ref, 'refs/tags/') && 'always' || 'never' }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tempest-launcher-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            Tempest.Launcher/dist/*.exe
            Tempest.Launcher/dist/*.msi
            Tempest.Launcher/dist/*.dmg
            Tempest.Launcher/dist/*.AppImage
            Tempest.Launcher/dist/*.deb
            Tempest.Launcher/dist/*.rpm
            Tempest.Launcher/dist/latest*.yml
            Tempest.Launcher/dist/*.blockmap
          if-no-files-found: error

  # The v1.0.3 (Tauri) Windows installs auto-update through the Tauri updater,
  # which reads latest.json from the latest published release and verifies a
  # minisign signature made with the old Tauri key. Keep generating it —
  # pointing at the current Electron NSIS installer — so those users are
  # migrated to the Electron build automatically. The installer runs silently
  # (/S); on first run the new launcher offers to remove the old Tauri MSI.
  tauri-manifest:
    needs: [release, build]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-22.04
    steps:
      - name: Resolve version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Download the Windows installer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --pattern "Tempest-Launcher-Setup-*.exe" --dir .

      - name: Sign with the Tauri updater key
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          npx --yes @tauri-apps/cli signer sign \
            -k "$TAURI_SIGNING_PRIVATE_KEY" \
            -p "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" \
            "Tempest-Launcher-Setup-$version.exe"

      - name: Write and upload latest.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NOTES: ${{ needs.release.outputs.notes }}
        run: |
          sig=$(cat "Tempest-Launcher-Setup-$version.exe.sig")
          url="https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/Tempest-Launcher-Setup-$version.exe"
          # windows-x86_64-msi: v1.0.3 was installed through the MSI, so its
          # updater asks for the -msi variant; the NSIS exe installs silently
          # either way. Only drafts and prereleases are excluded from the
          # updater endpoint (releases/latest), so publishing the draft is
          # what flips Tauri users to this version.
          jq -n --arg version "$version" --arg notes "$NOTES" --arg sig "$sig" --arg url "$url" \
            '{
              version: $version,
              notes: $notes,
              pub_date: (now | todateiso8601),
              platforms: {
                "windows-x86_64": {signature: $sig, url: $url},
                "windows-x86_64-msi": {signature: $sig, url: $url}
              }
            }' > latest.json
          gh release upload "$GITHUB_REF_NAME" latest.json --clobber --repo "$GITHUB_REPOSITORY"
