# Keeps the caches release builds restore from alive. GitHub scopes caches per
# branch/tag: tag-triggered release runs can only restore from the default
# branch's scope, and cannot write there. This workflow runs on master (push,
# weekly cron so caches don't expire after 7 idle days) and saves the CLI
# sidecar binaries and electron tooling downloads into that scope.
name: Warm Caches

on:
  push:
    branches: [master]
  schedule:
    - cron: "0 3 * * 1" # weekly, Monday 03:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: warm-cache-${{ github.ref }}
  cancel-in-progress: true

jobs:
  warm:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            arch: x64
          - platform: macos-14
            arch: arm64
          - platform: ubuntu-22.04
            arch: x64

    runs-on: ${{ matrix.platform }}

    env:
      # Same workspace-scoped download dirs the release build uses.
      ELECTRON_CACHE: ${{ github.workspace }}/.electron-cache
      ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.electron-builder-cache

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10.0
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Setup Zig 0.16.0
        uses: marler8997/setup-anyzig@master

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: Tempest.Launcher/package.json

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: Tempest.Launcher/pnpm-lock.yaml

      - name: Install Linux packaging deps
        if: startsWith(matrix.platform, 'ubuntu-')
        run: |
          sudo apt update
          sudo apt-get install -y rpm fakeroot

      # ---- CLI sidecar: the expensive AOT publish ----

      - name: Restore CLI sidecar binaries
        id: cli-cache
        uses: actions/cache/restore@v4
        with:
          path: Tempest.Launcher/electron/resources/binaries
          # Must stay identical to the key in release.yml.
          key: cli-${{ runner.os }}-${{ hashFiles('Tempest.CLI/**', 'MarshalLib/**', 'MarshalLib.Database/**', 'Tempest.Utils/**', 'Tempest.Protocol/**', 'Tempest.Launcher/scripts/build-cli.js', 'keys/*.keys') }}

      - name: Install frontend dependencies
        working-directory: Tempest.Launcher
        run: pnpm install --frozen-lockfile

      - name: Build CLI sidecar
        if: steps.cli-cache.outputs.cache-hit != 'true'
        working-directory: Tempest.Launcher
        run: node scripts/build-cli.js

      - name: Save CLI sidecar binaries
        if: steps.cli-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: Tempest.Launcher/electron/resources/binaries
          # Reuse the restore step's pre-build key: the build creates files
          # inside the hashed patterns (zig-out), so recomputing hashFiles
          # here would save under a key no restore can ever find.
          key: ${{ steps.cli-cache.outputs.cache-primary-key }}

      # ---- Electron / electron-builder tooling downloads ----

      - name: Restore Electron / electron-builder downloads
        id: electron-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            .electron-cache
            .electron-builder-cache
          key: electron-tooling-${{ runner.os }}-${{ hashFiles('Tempest.Launcher/pnpm-lock.yaml') }}

      # One full electron-builder run downloads the Electron dist plus the
      # per-target packaging tooling (NSIS, AppImage, deb/rpm helpers); the
      # downloaded caches are what the release build reuses.
      - name: Seed electron tooling downloads
        if: steps.electron-cache.outputs.cache-hit != 'true'
        working-directory: Tempest.Launcher
        shell: bash
        run: |
          pnpm build
          rm -rf electron/build
          cp -r build electron/build
          cd electron
          npx electron-builder --publish never

      - name: Save Electron / electron-builder downloads
        if: steps.electron-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            .electron-cache
            .electron-builder-cache
          key: ${{ steps.electron-cache.outputs.cache-primary-key }}
