appId: com.lowrezstudio.tempest
productName: Tempest Launcher
fileAssociations:
    - ext: tempest
      name: Tempest Mod
      description: Tempest Mod Package
      mimeType: application/x-tempest-mod
      role: Viewer
nsis:
    # Uninstalls any leftover Tauri MSI build of the app (see installer.nsh)
    include: resources/installer.nsh
electronLanguages:
    - en-US
    - fr
    - es
    - es-419
    - pl
    - ru
directories:
    output: ../dist
files:
    - build/**/*
    - src/**/*
    - package.json
extraResources:
    - from: resources/binaries
      to: binaries
    - from: resources/mods
      to: mods
    - from: resources/icons/icon.png
      to: icon.png
win:
    target: nsis
    icon: resources/icons/icon.ico
mac:
    target: dmg
    icon: resources/icons/icon.icns
    category: public.app-category.games
linux:
    target:
        - AppImage
        - deb
        - rpm
    icon: resources/icons
    category: Game
publish:
    provider: github
    owner: LowRezStudio
    repo: Tempest
